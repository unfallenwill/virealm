[package]
name = "virealm-process-runtime"
description = "Constrained process lifecycle management for Virealm environments."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "virealm_process_runtime"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
serde_json.workspace = true

[[bin]]
name = "virealm-runtime"
path = "src/bin/virealm-runtime.rs"

[[bin]]
name = "virealm-test-child"
path = "src/bin/virealm-test-child.rs"
