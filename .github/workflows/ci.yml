name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # The root scripts invoke `corepack pnpm`, which resolves the version pinned in
  # package.json. On a fresh runner that means a first-time download; without
  # this flag corepack would stop on an interactive prompt.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  contracts:
    name: Contracts (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm has to exist before setup-node runs: the `cache: pnpm` option
      # resolves the store path by calling pnpm, and fails with
      # "Unable to locate executable file: pnpm" when it is missing.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:check-generated
      - run: pnpm contracts:lint
      - run: pnpm contracts:format:check
      - run: pnpm contracts:typecheck
      - run: pnpm contracts:test
      - run: pnpm contracts:build

  runtime:
    name: Process Runtime (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  browser-adapter:
    name: Browser Adapter (Windows, real Chrome)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: cargo build -p virealm-process-runtime --bin virealm-runtime
      - name: Verify Chrome is installed
        run: |
          $chrome = "$env:ProgramFiles\Google\Chrome\Application\chrome.exe"
          $versioned = Get-ChildItem "$env:ProgramFiles\Google\Chrome\Application" -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' }
          if (-not (Test-Path $chrome) -and -not $versioned) {
            throw "Chrome is required for the real-browser integration gate"
          }
      # The type-aware ESLint rules read the sibling packages through their
      # built declarations. A fresh checkout has no dist/ yet, so the
      # dependencies are built first — the same order as the root `check`.
      - run: pnpm contracts:build
      - run: pnpm runtime-client:build
      - run: pnpm adapter:lint
      - run: pnpm adapter:format:check
      - run: pnpm adapter:typecheck
      - run: pnpm adapter:test
      - run: pnpm adapter:build
      # The verbose reporter keeps the observed abort code in the CI log: the
      # code Chromium uses when it cannot start its sandbox differs between
      # builds, and the runner's value is evidence for that.
      - run: pnpm --filter @virealm/browser-adapter exec vitest run --config vitest.integration.config.ts --reporter=verbose

  desktop:
    name: Desktop (Windows, Electron + real Chrome)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: cargo build -p virealm-process-runtime --bin virealm-runtime
      - name: Verify Chrome is installed
        run: |
          $chrome = "$env:ProgramFiles\Google\Chrome\Application\chrome.exe"
          $versioned = Get-ChildItem "$env:ProgramFiles\Google\Chrome\Application" -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' }
          if (-not (Test-Path $chrome) -and -not $versioned) {
            throw "Chrome is required for the desktop integration gate"
          }
      # The type-aware ESLint rules read the sibling packages through their
      # built declarations. A fresh checkout has no dist/ yet, so the
      # dependencies are built first — the same order as the root `check`.
      - run: pnpm contracts:build
      - run: pnpm runtime-client:build
      - run: pnpm adapter:build
      - run: pnpm desktop:lint
      - run: pnpm desktop:format:check
      - run: pnpm desktop:typecheck
      - run: pnpm desktop:test
      - run: pnpm desktop:build
      - run: pnpm desktop:test:integration
